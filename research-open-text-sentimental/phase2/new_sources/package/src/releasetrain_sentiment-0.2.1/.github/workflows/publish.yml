name: Publish to PyPI

# Triggers on a GitHub Release being published (tag it v0.1.0, v0.1.1, ...
# and draft a release from that tag). Uses PyPI Trusted Publishing: no
# API token is stored anywhere. PyPI verifies this exact repo + workflow
# filename via OIDC at publish time, once a pending publisher is
# registered on the PyPI project (see README.md "Releasing" section).
on:
  release:
    types: [published]

permissions:
  id-token: write  # required for PyPI's trusted-publisher OIDC exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
